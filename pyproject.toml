[project]
name = "multiplex"
version = "0.1.0"
description = "⚠️ A Modular LLM-based Mutation Tool."
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "litellm>=1.109.1",
    "openai>=1.104.2",
    "pyyaml>=6.0.2",
    "tree-sitter==0.23.2",
    "tree-sitter-java==0.23.5",
    "tree-sitter-python>=0.23,<0.24",
]

[dependency-groups]
dev = [
    "pylint>=4.0.9",
    "pytest>=9.0.3",
    "ruff>=0.11.12",
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
]
