# config-python.yml — self-contained Python example.
# Run from the repo root:  uv run ./multiplex ./examples/config-python.yml
#
# Requirements for this example:
#   - pytest available for the active interpreter (it is a dev dependency of
#     this repo, so `uv run` already provides it) — used by the `pytest` runtool.
#   - A running Ollama serving the model named under `llm.model`
#     (`ollama pull gpt-oss:20b`, or point `llm.model` at any model you have).

project:
    language: python
    projectroot: examples/project/python-example
    filename: examples/project/python-example/classifier.py
    method: classify
    line: 4
    runtool: pytest

mutation:
    approach: basic

llm:
    model: ollama/gpt-oss:20b
    endpoint: http://127.0.0.1:11434
    token_env_var: # env var name storing token (NOT the token itself)

system_prompts:
    # Only the prompts for the selected `mutation.approach` are required.
    # `basic` (the approach used above) needs only `basic_generate_mutants`.
    basic_generate_mutants: |
        You are a code generator.
        When given a Python function, re-implement it with a single small behavioral defect (a mutant).
        Change exactly one thing: an operator, a boundary condition, a constant, or a returned value.
        Include a concise code comment describing the injected defect.
        Output the defective Python code only and nothing else.

    # The prompts below let you switch `mutation.approach` to hazop or stpa
    # without editing anything else.
    hazop_describe_process: |
        When given a Python function, describe the intent of the code in a line-by-line manner, as concisely as possible.

        Explain what the code does, not how it is written.
        End each line with a comma and don't use commas anywhere else.
        Break the explanation into line-numbered steps and return the line-numbered steps.
    hazop_identify_deviations: |
        For each numbered description, output one version of the string where one of the rules has changed.
        The rule must be changed using one of the "guidewords" from HAZOP.
        The guidewords and their interpretation is delimited by ###, in the form guideword - interpretation.
        That is, everything before - is the guideword and everything after is the meaning.

        ###

        No (not, none) - None of the design intent is achieved
        More (more of, higher) - Quantitative increase in a parameter
        Less (less of, lower) - Quantitative decrease in a parameter
        As well as (more than) - An additional activity occurs
        Part of - Only some of the design intention is achieved
        Reverse - Logical opposite of the design intent occurs
        Other than (other) - Complete substitution (another activity takes place or an unusual activity occurs or uncommon condition exists)

        ###

        Please output each new rule, as a csv line, without headings in the format:
        "number, original_rule, guideword (CAPITALIZED), changed_rule"
    hazop_implement_deviations: |
        You are a code generator.
        When given a description, re-implement the function but with the incorrect behavior/defect as described in the description.

        Include a concise code comment to describe the implemented defect.
        Output the defective Python code only and nothing else.
    stpa_describe_control_flow: |
        You describe Python functions as control flow diagrams.
        When given a Python function, create a written description in the DOT language used in GraphViz of the control structure.
        Use human readable labels and descriptions for each node.
        Output the control diagram only, and nothing else.
    stpa_identify_ucas: |
        Identify 10 different Unsafe Control Actions (UCAs) within the control diagram described in DOT language, referencing the code, using each of the guidewords delimited by ### below:

        ###
        * provides
        * does not provide
        * too early
        * too late
        * out of order
        * stopped too soon
        * applied for too long

        ###

        You must describe each UCA in the format: <Variable or Structure><ControlAction><Guideword><Context>

        An example of this is:
        variable x calculated out of order when sorting has not occurred.

        Output the numbered list of UCAs with no empty lines, and nothing else.
    stpa_implement_ucas: |
        You are a code generator.
        When given a description, re-implement the function but with the incorrect behavior/defect as described in the description.

        Include a concise code comment to describe the implemented defect.
        Output the defective Python code only and nothing else.

    # llmorpheus fills a <PLACEHOLDER> in a code fragment with a buggy variant.
    llmorpheus_system: |
        You are an expert Python programmer applying mutation testing.
        You will be given a Python code fragment containing a single PLACEHOLDER.
        Replace the PLACEHOLDER with a short code fragment that is syntactically
        valid Python and changes the behavior of the original fragment.
        Follow the response template you are given exactly.

    # The mutahunter approach needs its own prompt to run:
    #   - mutahunter: prompts must be supplied by you (licensing) — see README.
